# Descarga las convocatorias nuevas de la Base de Datos Nacional de Subvenciones, regenera la web y la publica en GitHub Pages.
# Funciona solo: no hay que tocar nada. También se ejecuta al cambiar cualquier fichero del repositorio.
name: Actualizar y publicar

on:
  schedule:
    # Tres veces al día (hora UTC), en minutos poco habituales: GitHub se salta a veces las ejecuciones programadas.
    - cron: '37 6 * * *'
    - cron: '41 12 * * *'
    - cron: '43 18 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Actualizar la lista de entidades locales
        run: node tools/locales.mjs

      - name: Descargar las convocatorias nuevas (BDNS)
        run: node src/fetch.mjs

      - name: Generar la web
        run: node src/build.mjs

      - name: Comprobar que no hay nada roto
        run: node tools/check.mjs

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  avisar:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Avisar a los buscadores (IndexNow)
        if: github.event_name != 'schedule' || github.event.schedule == '37 6 * * *'
        run: node tools/indexnow.mjs ${{ github.event_name == 'schedule' && 'diario' || 'todo' }}
        continue-on-error: true
      - name: Mantener activa la programación
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/publicar.yml/enable" || true
      - name: Comprobar que la web tiene los datos de hoy
        # Si falla, GitHub te envía un correo. La web sigue online con los últimos datos.
        run: sleep 60 && node tools/estado.mjs
